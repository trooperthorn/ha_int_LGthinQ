name: Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install direct client test dependencies
        run: python -m pip install aiohttp==3.14.3 cryptography==48.0.1 paho-mqtt==2.1.0
      - name: Test and compile
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components tests
      - name: Check metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/lg_thinq_extended')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['requirements'] == ['paho-mqtt==2.1.0']
          for path in root.rglob('*.py'):
              text = path.read_text(encoding='utf-8-sig')
              assert 'from thinqconnect' not in text and 'import thinqconnect' not in text
              assert 'from OpenSSL' not in text
          json.loads((root / 'strings.json').read_text(encoding='utf-8'))
          json.loads((root / 'icons.json').read_text(encoding='utf-8'))
          PY


  home-assistant-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.0 paho-mqtt==2.1.0
      - name: Import every integration platform against Home Assistant
        run: |
          python - <<'PY'
          import importlib
          from pathlib import Path
          for path in Path('custom_components/lg_thinq_extended').glob('*.py'):
              importlib.import_module('custom_components.lg_thinq_extended.' + path.stem)
          PY
